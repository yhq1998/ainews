<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>瑞泊-AI动态</title>
<meta name="description" content="AI 行业动态看板：定时刷新、滚动播报、热点榜与 Codex 重置日历">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AI动态">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #efede7;
    --text: #1d1c19;
    --muted: #6d6a62;
    --line: #e2dfd6;
    --accent: #d9480f;
    --accent-soft: #fff1e8;
    --ok: #2b8a3e;
    --err: #c92a2a;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    /* 分类标签颜色：模型 紫 / 产品 蓝 / 行业 绿 / 论文 玫红 / 技巧 琥珀（避开强调色的橙） */
    --cat-models: #6d3fc4; --cat-products: #1c62c4; --cat-industry: #217a3c; --cat-paper: #b82d6b; --cat-tip: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --surface: #1d1d1b; --surface-2: #262623; --text: #ecebe6;
      --muted: #9a978d; --line: #30302c; --accent: #ff8a4c; --accent-soft: #33200f;
      --ok: #69db7c; --err: #ff8787; --shadow: none;
      --cat-models: #b79cf5; --cat-products: #7fb0ff; --cat-industry: #7bd18f; --cat-paper: #f58cb8; --cat-tip: #e6b85c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --surface: #1d1d1b; --surface-2: #262623; --text: #ecebe6;
    --muted: #9a978d; --line: #30302c; --accent: #ff8a4c; --accent-soft: #33200f;
    --ok: #69db7c; --err: #ff8787; --shadow: none;
      --cat-models: #b79cf5; --cat-products: #7fb0ff; --cat-industry: #7bd18f; --cat-paper: #f58cb8; --cat-tip: #e6b85c;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent); }
  button, select, input { font: inherit; color: inherit; }

  header {
    position: sticky; top: 0; z-index: 10;
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .bar { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 8px; align-items: center; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; margin-right: 6px; white-space: nowrap; flex: none; }
  .bar > .btn { order: 2; width: 36px; padding: 0; flex: none; }
  /* 安装按钮：橙色描边，带文字，比其他图标按钮醒目 */
  .bar > .btn.install { width: auto; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent-soft); font-weight: 600; white-space: nowrap; }
  .btn.install svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .steps { list-style: none; margin: 14px 0 0; padding: 0; counter-reset: st; }
  .steps li { position: relative; padding: 0 0 14px 40px; font-size: 15px; line-height: 1.6; counter-increment: st; }
  .steps li::before { content: counter(st); position: absolute; left: 0; top: 1px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .steps kbd, .gcar kbd { font: inherit; font-weight: 600; background: var(--surface-2); border-radius: 5px; padding: 1px 7px; white-space: nowrap; }
  .steps svg { width: 18px; height: 18px; vertical-align: -4px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .install-note { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  /* iPhone 图文教程：横向滑动的步骤卡片 */
  .gcar { margin: 14px -20px 0; }
  .gcar .track { list-style: none; margin: 0; padding: 0 20px; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .gcar .track::-webkit-scrollbar { display: none; }
  .gcar .card { flex: 0 0 min(100% - 44px, 320px); scroll-snap-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .gcar .txt { padding: 12px 14px 10px; display: grid; grid-template-columns: 26px 1fr; column-gap: 10px; align-items: start; min-height: 74px; }
  .gcar .txt p { margin: 0; grid-column: 2; font-size: 14.5px; line-height: 1.55; }
  .gcar .txt .note { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .gcar .num { grid-row: 1 / span 2; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; }
  .gcar .card img { display: block; width: 100%; height: auto; aspect-ratio: 600 / 1304; border-top: 1px solid var(--line); background: var(--surface-2); }
  .gcar .nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; }
  .gcar .nav .btn { width: 36px; padding: 0; font-size: 18px; border-radius: 50%; }
  .gcar .dots { display: flex; gap: 6px; }
  .gcar .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); cursor: pointer; }
  .gcar .dots i.on { background: var(--accent); }
  .gcar-tip { margin: 16px 0 0; padding: 12px 14px; background: var(--accent-soft); border-radius: 12px; font-size: 13.5px; line-height: 1.6; }
  .gcar-tip b { color: var(--accent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); animation: pulse 2s infinite; }
  .dot.busy { background: var(--accent); }
  .dot.err { background: var(--err); }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  .status { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  /* 和标题、按钮排在同一行；窗口较窄时控件在自己的区域内换行 */
  .controls { order: 1; flex: 1 1 0; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 4px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
  select, input[type="search"], .btn {
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px; font-size: 14px; height: 34px;
  }
  input[type="search"] { flex: 1 1 120px; min-width: 100px; outline: none; }
  input[type="search"]:focus, select:focus { border-color: var(--accent); }
  .btn { cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }

  main { max-width: 1120px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } aside { order: -1; } }

  .error { display: none; margin-bottom: 12px; padding: 10px 14px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--err) 40%, transparent); color: var(--err); font-size: 14px; word-break: break-word; }
  .error.show { display: block; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    box-shadow: var(--shadow); position: relative; overflow-wrap: anywhere;
  }
  .card.fresh { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); animation: flash 2.4s ease-out; }
  .card.fresh::before { content: "NEW"; position: absolute; top: 12px; right: 14px; font-size: 10px; font-weight: 700; letter-spacing: .06em; color: #fff; background: var(--accent); border-radius: 5px; padding: 1px 6px; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: var(--surface); } }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12.5px; color: var(--muted); padding-right: 44px; }
  .chip { background: var(--surface-2); color: var(--text); border-radius: 6px; padding: 0 7px; font-size: 12px; line-height: 20px; }
  .chip[data-cat] { background: color-mix(in srgb, var(--c, var(--muted)) 14%, transparent); color: var(--c, var(--text)); font-weight: 600; }
  .chip[data-cat="ai-models"] { --c: var(--cat-models); }
  .chip[data-cat="ai-products"] { --c: var(--cat-products); }
  .chip[data-cat="industry"] { --c: var(--cat-industry); }
  .chip[data-cat="paper"] { --c: var(--cat-paper); }
  .chip[data-cat="tip"] { --c: var(--cat-tip); }
  .chip.star { background: var(--accent-soft); color: var(--accent); }
  .card h2 { margin: 6px 0 6px; font-size: 16.5px; line-height: 1.45; font-weight: 650; }
  .card p { margin: 0; color: color-mix(in srgb, var(--text) 86%, var(--muted)); }
  .reason { margin-top: 8px !important; padding-left: 10px; border-left: 2px solid var(--accent); font-size: 13.5px; color: var(--muted) !important; }
  .links { margin-top: 9px; display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
  .links a { border-bottom: 1px dotted currentColor; }

  aside .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); position: sticky; top: calc(var(--header-h, 110px) + 16px); max-height: calc(100vh - var(--header-h, 110px) - 32px); overflow: auto; }
  @media (max-width: 860px) { aside .panel { position: static; max-height: 300px; } }
  /* 热点榜：强调色顶边 + 吸顶标题带，前三名放大，状态用一眼能懂的胶囊标签 */
  aside .panel { padding: 0; border-top: 3px solid var(--accent); }
  .hot-head { position: sticky; top: 0; z-index: 1; border-radius: 10px 10px 0 0; padding: 12px 16px 10px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, var(--accent-soft), var(--surface) 90%); }
  .hot-head h3 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .02em; display: flex; align-items: center; gap: 6px; }
  .hot-head h3 svg { width: 19px; height: 19px; fill: var(--accent); flex: none; }
  .hot-head h3 small { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 12px; letter-spacing: 0; }
  .hot-head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  ol.hot { list-style: none; margin: 0; padding: 0; }
  ol.hot li { display: grid; grid-template-columns: 30px 1fr; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
  ol.hot li:first-child { border-top: 0; }
  .rank { font-size: 19px; font-weight: 800; font-style: italic; line-height: 1.25; color: color-mix(in srgb, var(--muted) 55%, transparent); font-variant-numeric: tabular-nums; }
  ol.hot li.top .rank { color: var(--accent); }
  ol.hot li.top a { font-weight: 650; }
  ol.hot li.first { background: color-mix(in srgb, var(--accent-soft) 65%, transparent); }
  ol.hot li.first a { font-size: 15px; }
  .hot small { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .hot small b { color: var(--text); font-weight: 700; font-size: 13px; }
  .mv { font-size: 11px; font-weight: 700; line-height: 17px; padding: 0 6px; border-radius: 9px; white-space: nowrap; }
  .mv.up { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .mv.down { color: var(--err); background: color-mix(in srgb, var(--err) 13%, transparent); }
  .mv.new { color: #fff; background: var(--accent); }
  .heat { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 7px; overflow: hidden; }
  .heat i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 55%, transparent), var(--accent)); }
  /* Tibo 重置日历卡片：左边是选中日期的预告/记录，右边是月历；高度约等于两张资讯卡片 */
  .tibo { border-color: color-mix(in srgb, var(--cat-tip) 45%, var(--line)); background: linear-gradient(180deg, color-mix(in srgb, var(--cat-tip) 7%, var(--surface)), var(--surface) 70%); }
  .tibo-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid color-mix(in srgb, var(--cat-tip) 25%, var(--line)); }
  .tibo-head strong { font-size: 17px; font-weight: 800; color: var(--cat-tip); letter-spacing: .01em; }
  .tibo-head .sub { font-size: 12.5px; color: var(--muted); }
  .tibo-head .sp { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 12px; }
  .tibo-head .sp a, .tibo-head .sp button { border: 0; background: none; padding: 0; color: inherit; cursor: pointer; border-bottom: 1px dotted currentColor; font-size: 12px; }
  .tibo-grid { display: grid; grid-template-columns: minmax(0, 1fr) 294px; gap: 20px; align-items: start; }
  .tibo-info { max-height: 312px; overflow-y: auto; scrollbar-width: thin; }
  .tibo-eyebrow { font-size: 12.5px; color: var(--muted); }
  .tibo-date { font-size: 28px; font-weight: 800; line-height: 1.25; letter-spacing: .01em; }
  .tibo-date small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 8px; }
  .tibo-count { display: inline-block; margin-top: 4px; padding: 1px 9px; border-radius: 10px; font-size: 12.5px; font-weight: 700; color: #fff; background: var(--accent); }
  .tibo-ev { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .tibo-ev h4 { margin: 6px 0 2px; font-size: 15px; line-height: 1.4; }
  .tibo-ev .when { font-size: 13px; color: var(--cat-products); }
  .tibo-ev .scope { font-size: 12.5px; color: var(--muted); }
  .tibo-post { margin: 8px 0 0; padding: 8px 10px; border-radius: 9px; background: var(--surface-2); font-size: 13.5px; line-height: 1.55; }
  .tibo-post q { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; quotes: none; }
  .tibo-post small { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 5px; color: var(--muted); font-size: 12px; }
  .tibo-post small a { border-bottom: 1px dotted currentColor; }
  .st { display: inline-block; border-radius: 6px; padding: 0 7px; font-size: 12px; line-height: 20px; font-weight: 600; margin-right: 6px; }
  .st.announced { color: var(--cat-tip); background: color-mix(in srgb, var(--cat-tip) 16%, transparent); }
  .st.confirmed { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .st.kind { color: var(--text); background: var(--surface-2); }
  .cal-head { display: flex; align-items: center; font-weight: 700; font-size: 14px; }
  .cal-head span { margin-right: auto; }
  .cal-head button { border: 0; background: none; width: 28px; height: 26px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; }
  .cal-head button:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
  .cal-head button:disabled { opacity: .3; cursor: default; }
  .cal-sum { font-size: 11.5px; color: var(--muted); margin: 1px 0 5px; min-height: 17px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-grid .wd { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 2px; }
  .day { height: 36px; padding: 0; border: 1.5px solid transparent; border-radius: 8px; background: color-mix(in srgb, var(--surface-2) 55%, transparent); color: var(--text); font: inherit; font-size: 12.5px; line-height: 1.1; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .day.blank { background: none; }
  .day i { font-style: normal; font-size: 9px; font-weight: 600; margin-top: 2px; }
  button.day { cursor: pointer; }
  button.day:hover { border-color: var(--line); }
  .day.confirmed { background: color-mix(in srgb, var(--ok) 15%, transparent); }
  .day.confirmed i { color: var(--ok); }
  .day.announced { background: color-mix(in srgb, var(--cat-tip) 18%, transparent); }
  .day.announced i { color: var(--cat-tip); }
  .day.today b { font-weight: 800; text-decoration: underline; text-underline-offset: 2px; }
  .day b { font-weight: 500; }
  .day.sel { border-color: var(--accent); }
  .cal-legend { margin-top: 6px; font-size: 11px; color: var(--muted); display: flex; gap: 12px; }
  .cal-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  @media (max-width: 860px) {
    .tibo-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .tibo-info { max-height: none; }
    .day { height: 40px; }
  }
  /* 站内阅读面板：桌面端从右侧滑出，手机端全屏 */
  .card h2 a, ol.hot li > div > a.t { cursor: pointer; }
  .rd-overlay { position: fixed; inset: 0; z-index: 39; background: rgba(0,0,0,.42); opacity: 0; pointer-events: none; transition: opacity .2s; }
  /* 桌面端：居中的对话框，高度随内容、最多占 86% 视口；打开时轻微放大淡入 */
  .reader { position: fixed; inset: 0; margin: auto; z-index: 40; width: min(92vw, 720px); height: fit-content; max-height: min(86vh, 920px); border-radius: 16px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); box-shadow: 0 24px 80px rgba(0,0,0,.28); display: flex; flex-direction: column; opacity: 0; transform: scale(.96) translateY(10px); visibility: hidden; transition: opacity .18s ease, transform .22s ease, visibility 0s .22s; }
  @media (max-width: 860px) { .reader { inset: 0; width: auto; height: auto; max-height: none; border-radius: 0; border: 0; transform: translateY(24px); } }
  body.reader-open { overflow: hidden; }
  body.reader-open .rd-overlay { opacity: 1; pointer-events: auto; }
  body.reader-open .reader { opacity: 1; transform: none; visibility: visible; transition: opacity .18s ease, transform .22s ease; }
  .rd-bar { display: flex; align-items: center; gap: 10px; padding: calc(10px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) 14px 10px 18px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
  .rd-bar .kind { font-size: 13px; font-weight: 700; color: var(--muted); margin-right: auto; }
  .rd-bar .btn { width: 36px; padding: 0; font-size: 18px; }
  .rd-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px 20px calc(24px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); overscroll-behavior: contain; }
  .rd-body h2 { margin: 8px 0 6px; font-size: 21px; line-height: 1.4; font-weight: 750; }
  .rd-orig { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  .rd-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; color: var(--muted); font-size: 13px; }
  .rd-sec { margin-top: 20px; }
  .rd-sec h3 { margin: 0 0 6px; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; color: var(--accent); }
  .rd-sec p { margin: 0; font-size: 15.5px; line-height: 1.75; }
  .rd-sec .note { color: var(--muted); font-size: 13px; line-height: 1.6; }
  .rd-act { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .rd-act .btn { display: inline-flex; align-items: center; justify-content: center; height: 38px; line-height: 1; padding: 0 14px; }
  .rd-act .primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; padding: 0 18px; }
  .rd-act .primary:hover { filter: brightness(1.08); color: #fff; }
  .rd-stat { display: flex; gap: 18px; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .rd-stat b { display: block; font-size: 18px; color: var(--text); }
  .tl { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
  .tl li { position: relative; padding: 0 0 16px 14px; }
  .tl li::before { content: ""; position: absolute; left: -19px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--line); border: 2px solid var(--bg); }
  .tl li:first-child::before { background: var(--accent); }
  .tl .when { font-size: 12px; color: var(--muted); }
  .tl h4 { margin: 2px 0 4px; font-size: 14.5px; line-height: 1.45; font-weight: 600; }
  .tl p { margin: 0; font-size: 13.5px; line-height: 1.6; color: color-mix(in srgb, var(--text) 85%, var(--muted)); }
  .tl .src { margin-top: 4px; font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .tl .src a { border-bottom: 1px dotted currentColor; }
  .rel { list-style: none; margin: 0; padding: 0; }
  .rel li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .rel li:first-child { border-top: 0; }
  .rel small { display: block; color: var(--muted); font-size: 12px; }
  .rel a { cursor: pointer; }
  .rd-loading { color: var(--muted); font-size: 13.5px; }
  .chip.onhot { background: var(--accent); color: #fff; font-weight: 600; }

  /* 滚动播报：固定高度的视窗，内容由脚本匀速上移，首尾用一份克隆无缝衔接 */
  .scroller.on {
    height: calc(100vh - var(--header-h, 110px) - 32px); min-height: 360px;
    overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
    padding: 14px 0;
  }
  .scroller.on::-webkit-scrollbar { display: none; }
  .scroller.on .card.fresh { animation: none; }
  /* 滚动关闭时（桌面端）：和右侧热点榜一样是固定高度的滚动区，带细滚动条，页面本身不再无限拉长 */
  @media (min-width: 861px) {
    .scroller.paged { height: calc(100vh - var(--header-h, 110px) - 32px); min-height: 360px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 45%, transparent) transparent; padding-right: 6px; }
    .scroller.paged::-webkit-scrollbar { width: 8px; }
    .scroller.paged::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 45%, transparent); border-radius: 4px; }
    .scroller.paged .card:last-of-type { margin-bottom: 0; }
  }
  /* 回到顶部：放在滚动内容末尾并 sticky 到底部，滚动区和整页滚动两种模式都能用 */
  .totop-wrap { position: sticky; bottom: 12px; height: 0; display: flex; justify-content: flex-end; pointer-events: none; z-index: 5; }
  .totop { pointer-events: auto; transform: translateY(-100%); margin-right: 10px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--text); box-shadow: 0 4px 16px rgba(0,0,0,.14); cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity .2s, visibility 0s .2s; }
  .totop svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .totop:hover { border-color: var(--accent); color: var(--accent); }
  .totop.show { opacity: 1; visibility: visible; transition: opacity .2s; }
  @media (max-width: 860px) { .totop-wrap { bottom: calc(var(--bottom-h) + 12px); } .totop { margin-right: 0; } }

  /* 自绘下拉框：系统原生的 select 在 macOS 上会把菜单盖在控件正中间，这里统一从控件下方展开。
     手机端仍用原生 select（系统自带的选择器更好用），见下方媒体查询 */
  .dd { position: relative; flex: none; }
  .dd select { display: none; }
  .dd-btn { display: flex; align-items: center; gap: 6px; height: 34px; padding: 5px 8px 5px 10px; font-size: 14px; white-space: nowrap; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
  .dd-btn:hover, .dd-btn[aria-expanded="true"] { border-color: var(--accent); }
  .dd-btn svg { width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
  .dd-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .dd-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 100%; margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.14); }
  .dd-menu.right { left: auto; right: 0; }
  .dd-menu li { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 6px 10px; border-radius: 6px; font-size: 14px; white-space: nowrap; cursor: pointer; outline: none; }
  .dd-menu li:hover, .dd-menu li:focus { background: var(--surface-2); }
  .dd-menu li[aria-selected="true"] { color: var(--accent); font-weight: 600; }
  .dd-menu li[aria-selected="true"]::after { content: "✓"; font-size: 12px; }

  /* 窄一些的桌面窗口：收紧间距、隐藏倒计时文字（悬停状态点仍可看），尽量保持一行 */
  @media (min-width: 861px) and (max-width: 1100px) {
    .status { display: none; }
    .seg button { padding: 4px 8px; }
    .controls { gap: 6px; }
    input[type="search"] { flex-basis: 70px; min-width: 70px; }
  }

  /* 控件分组：桌面端只是透明包装，标签文字不显示 */
  .field { display: contents; }
  .lbl, .drawer-head, .overlay, .tabbar { display: none; }

  /* ---------- 手机端 ---------- */
  @media (max-width: 860px) {
    :root { --bottom-h: calc(54px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); }
    /* backdrop-filter 会让 fixed 子元素以顶栏为基准，抽屉就出不来了，手机端改用纯色 */
    header { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--bg); }
    .bar { padding: 8px 12px; }
    .brand { font-size: 16px; min-width: 0; margin-right: auto; flex: 0 1 auto; }
    .status { overflow: hidden; text-overflow: ellipsis; font-size: 12px; font-weight: 400; }

    main { padding: 10px 12px calc(var(--bottom-h) + 12px); gap: 0; }
    body[data-view="feed"] main > aside, body[data-view="hot"] .feedcol { display: none; }
    aside .panel { position: static; max-height: none; overflow: visible; }
    ol.hot li { font-size: 15px; padding: 12px 14px; }
    .hot-head { position: static; }
    .scroller.on { height: calc(100vh - var(--header-h, 53px) - var(--bottom-h) - 20px); min-height: 240px; padding: 10px 0; }
    @supports (height: 100dvh) { .scroller.on { height: calc(100dvh - var(--header-h, 53px) - var(--bottom-h) - 20px); } }
    .card { padding: 12px 14px; }
    .card h2 { font-size: 16px; }

    .tabbar {
      display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
      height: var(--bottom-h); padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
      background: var(--surface); border-top: 1px solid var(--line);
    }
    .tabbar button { position: relative; border: 0; background: none; color: var(--muted); font-size: 11.5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tabbar button[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
    .badge { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: #fff; font: 600 10.5px/16px sans-serif; font-style: normal; text-align: center; }
    .badge.dot-only { min-width: 8px; width: 8px; height: 8px; padding: 0; top: 7px; left: calc(50% + 9px); }
    .badge[hidden] { display: none; }

    .overlay { display: block; position: fixed; inset: 0; z-index: 29; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .controls {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 30; width: min(86vw, 340px);
      flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 16px;
      padding: calc(14px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) 16px calc(20px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); overflow-y: auto;
      background: var(--bg); box-shadow: -10px 0 40px rgba(0,0,0,.2);
      transform: translateX(105%); visibility: hidden; transition: transform .24s ease, visibility 0s .24s;
    }
    body.filters-open { overflow: hidden; }
    body.filters-open .overlay { opacity: 1; pointer-events: auto; }
    body.filters-open .controls { transform: none; visibility: visible; transition: transform .24s ease; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .lbl { display: block; font-size: 12.5px; color: var(--muted); }
    .controls .seg { display: flex; }
    .controls .seg button { flex: 1; padding: 7px 0; }
    .controls select, .controls input[type="search"] { width: 100%; height: 40px; flex: none; font-size: 16px; }
    .dd select { display: block; }
    .dd-btn, .dd-menu { display: none; }
  }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  /* 列表末尾：加载更多 / 加载中 / 失败重试 / 已经到底 */
  .end { text-align: center; color: var(--muted); font-size: 13px; padding: 10px 0 20px; }
  .end .btn { min-width: 180px; height: 38px; }
  .end .err { display: block; color: var(--err); margin-bottom: 8px; }
  .end .line { display: flex; align-items: center; gap: 12px; }
  .end .line::before, .end .line::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="dot" id="dot"></span>AI 动态 <span class="status" id="status">准备中…</span></div>
    <button class="btn install" id="install" hidden title="安装到手机 / 电脑桌面"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 7v7M9.5 11.5 12 14l2.5-2.5M10 18h4"/></svg><span>安装</span></button>
    <button class="btn" id="refresh" title="立即刷新（快捷键 R）">↻</button>
    <button class="btn" id="theme" title="切换深浅色">◐</button>
    <div class="overlay" id="overlay"></div>
    <!-- 桌面端是顶栏里的一行控件；手机端同一份 DOM 变成右侧滑出的抽屉 -->
    <div class="controls" id="controls">
      <div class="drawer-head"><strong>筛选与设置</strong><button class="btn" id="closeFilters">完成</button></div>
      <div class="field"><span class="lbl">内容范围</span>
      <div class="seg" id="mode">
        <button data-v="selected">精选</button>
        <button data-v="all">全部</button>
      </div></div>
      <div class="field"><span class="lbl">时间窗口</span>
      <div class="seg" id="window">
        <button data-v="24h">24 小时</button>
        <button data-v="7d">7 天</button>
      </div></div>
      <label class="field"><span class="lbl">分类</span>
      <select id="category" aria-label="分类"></select></label>
      <label class="field"><span class="lbl">搜索</span>
      <input type="search" id="q" placeholder="搜索关键词" title="至少输入 2 个字" maxlength="200"></label>
      <label class="field"><span class="lbl">自动刷新</span>
      <select id="interval" aria-label="自动刷新间隔">
        <option value="60">每 1 分钟刷新</option>
        <option value="300">每 5 分钟刷新</option>
        <option value="900">每 15 分钟刷新</option>
        <option value="1800">每 30 分钟刷新</option>
        <option value="0">不自动刷新</option>
      </select></label>
      <label class="field"><span class="lbl">滚动播报</span>
      <select id="speed" aria-label="滚动播报速度" title="鼠标悬停在卡片上会暂停滚动">
        <option value="0">滚动：关</option>
        <option value="15">滚动：慢</option>
        <option value="28">滚动：中</option>
        <option value="50">滚动：快</option>
      </select></label>
    </div>
  </div>
</header>

<main>
  <section class="feedcol">
    <div class="error" id="error"></div>
    <div class="scroller" id="scroller">
      <div id="feed"><div class="empty">加载中…</div></div>
      <div id="feedClone" aria-hidden="true" hidden></div>
      <div class="totop-wrap"><button class="totop" id="totop" title="回到顶部" aria-label="回到顶部"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
    </div>
  </section>
  <aside>
    <div class="panel">
      <div class="hot-head">
        <h3><svg viewBox="0 0 24 24"><path d="M12.6 2c.7 3.7 5.4 6 5.4 11.3A6 6 0 0 1 6 13.5c0-2.4 1.2-3.9 2.5-5.1.2 1.900 1 2.900 2.100 3.300C10 8.3 10.9 4.6 12.6 2Z"/></svg>热点榜 <small id="hotAt"></small></h3>
        <p>过去 48 小时 · 多个信源共同印证的事件</p>
      </div>
      <ol class="hot" id="hot"><li><span></span><span style="color:var(--muted)">加载中…</span></li></ol>
    </div>
  </aside>
</main>

<!-- 仅手机端显示：资讯 / 热点榜 两个视图切换 + 打开筛选抽屉 -->
<div class="rd-overlay" id="rdOverlay"></div>
<aside class="reader" id="reader" role="dialog" aria-modal="true" aria-label="阅读">
  <div class="rd-bar"><span class="kind" id="rdKind"></span><button class="btn" id="rdClose" title="关闭（Esc）" aria-label="关闭">×</button></div>
  <div class="rd-body" id="rdBody"></div>
</aside>

<nav class="tabbar" id="tabbar">
  <button data-view="feed"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>资讯<i class="badge" id="feedBadge" hidden></i></button>
  <button data-view="hot"><svg viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.2 2-4.2.3 1.6 1 2.4 2 2.7-.6-3 .1-6 1-8.5Z"/></svg>热点榜</button>
  <button id="openFilters"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>筛选<i class="badge dot-only" id="filterBadge" hidden></i></button>
</nav>


<script>
(() => {
  const API = 'https://aihot.news/api/v1';
  const PAGE_SIZE = 50;
  // /items 与 /hot-topics 的 s-maxage 都是 60 秒，轮询更密只会拿到同一份缓存
  const MIN_INTERVAL = 60;
  // 滚动播报时自动把后面的分页都拉进来；「全部」模式 7 天内可能有上千条，设个上限免得页面过重
  const AUTO_LOAD_CAP = 300;
  const FRESH_TTL = 30 * 60 * 1000;   // 新条目的 NEW 标记保留 30 分钟
  const CATEGORIES = { '': '全部分类', 'ai-models': '模型', 'ai-products': '产品', 'industry': '行业', 'paper': '论文', 'tip': '技巧' };

  const store = {
    get(k, d) { try { const v = localStorage.getItem('aihot-live:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('aihot-live:' + k, JSON.stringify(v)); } catch {} },
  };

  const $ = id => document.getElementById(id);
  const state = {
    mode: store.get('mode', 'selected'),
    window: store.get('window', '7d'),
    category: store.get('category', ''),
    q: '',
    interval: store.get('interval', 300),
    speed: store.get('speed', matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 28),   // 滚动播报速度，px/秒；0 为关闭
    items: [], nextCursor: null,
    feedUrl: '', feedEtag: null, hotEtag: null,
    known: null,          // 当前查询下已见过的条目 id；null 表示还没有基线
    fresh: new Map(),     // 新条目 id → 发现时间；NEW 标记保留 FRESH_TTL 后自动消失
    resets: null, resetsEtag: null,   // Tibo 重置 / 发卡日历的事件列表
    tibo: { month: null, sel: null }, // 日历卡片当前看的月份和选中的日期；null 表示跟随默认焦点
    readerOpen: false,
    storyCache: new Map(),   // publicId → 事件详情（含 etag），面板打开时按需拉取
    hotRank: new Map(),   // 条目 id → 当前热点榜名次，用来在资讯卡片上打「热点」标记
    more: 'idle', moreError: null,   // 「加载更多」的状态：idle / loading / error
    nextAt: 0, loading: false, lastChecked: 0, error: null,
  };

  // ---------- helpers ----------
  function el(tag, props, ...children) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v);
    }
    for (const c of children) if (c != null) n.append(c);
    return n;
  }
  // 接口返回的是外部资料：只接受 http(s) 链接，文本一律走 textContent
  function safeUrl(u) { try { const p = new URL(u); return (p.protocol === 'https:' || p.protocol === 'http:') ? p.href : null; } catch { return null; } }
  function link(href, text, cls) {
    const u = safeUrl(href);
    return u ? el('a', { href: u, target: '_blank', rel: 'noopener noreferrer', class: cls, text }) : el('span', { class: cls, text });
  }
  function ago(iso) {
    const t = Date.parse(iso); if (isNaN(t)) return '';
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    if (s < 86400 * 7) return Math.floor(s / 86400) + ' 天前';
    return new Date(t).toLocaleDateString('zh-CN');
  }
  const clock = t => new Date(t).toLocaleTimeString('zh-CN', { hour12: false });
  const fullTime = iso => { const t = Date.parse(iso); return isNaN(t) ? '' : new Date(t).toLocaleString('zh-CN', { hour12: false }); };

  async function api(path, params, etag) {
    const url = new URL(API + path);
    for (const [k, v] of Object.entries(params || {})) if (v) url.searchParams.set(k, v);
    const headers = { Accept: 'application/json' };
    if (etag) headers['If-None-Match'] = etag;
    const res = await fetch(url, { headers });
    if (res.status === 304) return { notModified: true };
    if (!res.ok) {
      let p = null; try { p = await res.json(); } catch {}
      const e = new Error((p && (p.detail || p.title)) || ('HTTP ' + res.status));
      e.status = res.status;
      e.retryAfter = parseInt(res.headers.get('Retry-After'), 10) || 0;
      e.requestId = (p && p.requestId) || res.headers.get('X-Request-Id');
      throw e;
    }
    return { data: await res.json(), etag: res.headers.get('ETag') };
  }

  const feedParams = cursor => ({
    mode: state.mode, window: state.window, category: state.category,
    q: state.q.length >= 2 ? state.q : '', limit: PAGE_SIZE, cursor,
  });
  const queryKey = () => JSON.stringify([state.mode, state.window, state.category, state.q.length >= 2 ? state.q : '']);

  // ---------- data ----------
  async function loadFeed() {
    const key = queryKey();
    const sameQuery = key === state.feedUrl;
    const r = await api('/items', feedParams(), sameQuery ? state.feedEtag : null);
    if (key !== queryKey()) return;              // 请求期间筛选条件变了，丢弃
    if (r.notModified) return;
    const page = r.data.items || [];
    state.feedEtag = r.etag; state.feedUrl = key;

    if (!sameQuery || !state.known) {
      // 新查询：以这一页为基线。若上次关闭页面时是同一查询，则把期间新增的标出来
      const saved = store.get('seen', null);
      state.fresh = new Map();
      if (saved && saved.key === key) {
        const seen = new Set(saved.ids);
        for (const it of page) if (!seen.has(it.id)) state.fresh.set(it.id, Date.now());
      }
      state.known = new Set(page.map(i => i.id));
      state.items = page;
      state.more = 'idle'; state.moreError = null;
      state.nextCursor = r.data.page && r.data.page.hasMore ? r.data.page.nextCursor : null;
    } else {
      let added = 0;
      for (const it of page) if (!state.known.has(it.id)) { state.known.add(it.id); state.fresh.set(it.id, Date.now()); added++; }
      if (added) ticker.rewind();                // 有新动态：滚动播报回到开头，先播新的
      // 第一页换成最新内容，保留用户已经“加载更多”翻出来的旧条目
      const ids = new Set(page.map(i => i.id));
      state.items = page.concat(state.items.filter(i => !ids.has(i.id)));
    }
    store.set('seen', { key, ids: state.items.slice(0, 300).map(i => i.id) });
    renderFeed();
  }

  async function loadMore() {
    if (!state.nextCursor || state.more === 'loading') return;
    state.more = 'loading'; state.moreError = null; renderEnd();
    const key = queryKey();
    try {
      const r = await api('/items', feedParams(state.nextCursor));
      if (key !== queryKey()) return;
      const have = new Set(state.items.map(i => i.id));
      for (const it of r.data.items || []) if (!have.has(it.id)) { state.items.push(it); state.known.add(it.id); }
      state.nextCursor = r.data.page && r.data.page.hasMore ? r.data.page.nextCursor : null;
      state.more = 'idle';
      renderFeed();
    } catch (e) {
      if (key !== queryKey()) return;
      state.more = 'error'; state.moreError = e;
      // 4xx 多半是滚动窗口前移后旧 cursor 失效：丢掉它，重新拉第一页；其余（断网、限流）保留 cursor 供重试
      if (e.status >= 400 && e.status < 500 && e.status !== 429) { state.nextCursor = null; state.feedEtag = null; state.known = null; refresh(); }
      renderEnd();
    } finally {
      if (state.more === 'loading') { state.more = 'idle'; renderEnd(); }
    }
  }

  // 滚动播报是循环播放，没有「底部」可言：不让用户点按钮，而是在后台逐页拉完（到上限为止）
  async function autoLoadAll() {
    if (state.autoLoading) return;
    state.autoLoading = true;
    try {
      while (state.speed > 0 && state.nextCursor && state.items.length < AUTO_LOAD_CAP && state.more !== 'error') {
        await loadMore();
        await new Promise(r => setTimeout(r, 400));   // 分页之间留点间隔，别对接口连发
      }
    } finally { state.autoLoading = false; renderEnd(); }
  }

  async function loadResets() {
    const r = await api('/codex-resets', null, state.resetsEtag);
    if (r.notModified) return;
    state.resetsEtag = r.etag;
    // 事件挂在哪一天：实际发生日 > 预计范围的起始日 > 确认时间 > 发帖时间。接口给的都是 +08:00 的北京时间，直接取日期部分
    state.resets = (r.data.events || []).map(e => ({ ...e, day: e.occurredOn || ((e.schedule && e.schedule.from) || e.confirmedAt || e.createdAt || '').slice(0, 10) })).filter(e => /^\d{4}-\d\d-\d\d$/.test(e.day));
    state.tibo = { month: null, sel: null };
    if (state.items.length) renderFeed();
  }

  async function loadHot() {
    const r = await api('/hot-topics', null, state.hotEtag);
    if (r.notModified) return;
    state.hotEtag = r.etag;
    const items = r.data.items || [];
    state.hotRank = new Map(items.map(t => [t.id, t.rank]));
    state.hotStory = new Map(items.map(t => [t.id, storyId(t)]));   // 条目 id → 事件 publicId
    renderHot(items);
    if (state.items.length) renderFeed();
  }

  async function refresh() {
    // 刷新途中又改了筛选条件：在途的结果会因条件不符被丢弃，所以记下来，等它结束后按新条件再拉一次
    if (state.loading) { state.again = true; return; }
    state.loading = true; state.again = false; renderStatus();
    let retryAfter = 0;
    const results = await Promise.allSettled([loadFeed(), loadHot(), loadResets()]);
    const failed = results.find(r => r.status === 'rejected');
    if (failed) { showError(failed.reason); retryAfter = failed.reason.retryAfter || 0; }
    else { state.error = null; $('error').classList.remove('show'); }
    state.lastChecked = Date.now();
    state.loading = false;
    schedule(retryAfter);
    renderStatus();
    if (state.again && !retryAfter) refresh();
    else if (state.speed > 0 && state.nextCursor && !retryAfter) {
      if (state.more === 'error') state.more = 'idle';
      autoLoadAll();
    }
  }

  function schedule(retryAfter) {
    if (!state.interval && !retryAfter) { state.nextAt = 0; return; }
    const wait = Math.max(state.interval || 0, retryAfter || 0, MIN_INTERVAL);
    state.nextAt = Date.now() + wait * 1000;
  }

  function resetQuery() {
    state.known = null; state.feedEtag = null; state.feedUrl = ''; state.fresh = new Map();
    state.items = []; state.nextCursor = null; state.more = 'idle'; state.moreError = null;
    $('feed').replaceChildren(el('div', { class: 'empty', text: '加载中…' }));
    ticker.sync(); ticker.rewind();
    renderBanner();
    refresh();
  }

  // ---------- render ----------
  function renderFeed() {
    const feed = $('feed');
    if (!state.items.length) {
      feed.replaceChildren(el('div', { class: 'empty', text: state.q.length >= 2 ? '没有匹配的内容' : '这个时间窗口内暂无内容' }));
    } else {
      feed.replaceChildren(...feedNodes(), endMarker(false));
    }
    ticker.sync();
    renderBanner();
  }

  // ---------- 滚动播报 ----------
  const ticker = (() => {
    const scroller = $('scroller'), feed = $('feed'), clone = $('feedClone');
    let pos = 0, last = 0, hover = false, kbFocus = false, touchUntil = 0;

    // 内容比视窗高才需要循环：在末尾接一份克隆，滚过一整份后把位置减回去，视觉上无缝
    function sync() {
      scroller.classList.toggle('on', state.speed > 0);
      scroller.classList.toggle('paged', !(state.speed > 0));
      clone.replaceChildren();
      clone.hidden = true;
      if (!state.speed || !state.items.length) return;
      if (feed.offsetHeight <= scroller.clientHeight) return;
      clone.replaceChildren(...feedNodes(), endMarker(true));
      feed.querySelector('.end').replaceWith(endMarker(true));
      clone.querySelectorAll('a').forEach(a => a.setAttribute('tabindex', '-1'));
      clone.hidden = false;
    }
    function rewind() { pos = 0; scroller.scrollTop = 0; }

    function frame(t) {
      const dt = Math.min(100, t - last); last = t;
      const paused = hover || kbFocus || state.readerOpen || Date.now() < touchUntil;
      if (state.speed && !clone.hidden) {
        // 用户用滚轮/触摸自己滚过：以实际位置为准接着播
        if (paused || Math.abs(scroller.scrollTop - pos) > 2) pos = scroller.scrollTop;
        const len = clone.offsetTop - feed.offsetTop;
        const before = pos;
        if (!paused) pos += state.speed * dt / 1000;
        if (len > 0 && pos >= len) pos -= len;
        if (pos !== before) scroller.scrollTop = pos;
      }
      requestAnimationFrame(frame);
    }

    // 用 mousemove 而不只是 mouseenter：切回标签页后鼠标若仍在区域内，动一下就能重新识别为悬停
    scroller.addEventListener('mousemove', () => { hover = true; });
    scroller.addEventListener('mouseleave', () => { hover = false; });
    // 点链接跳到新标签页时不会触发 mouseleave，离开页面时主动清掉悬停状态，否则回来后一直停着
    const release = () => { hover = false; };
    addEventListener('blur', release);
    document.addEventListener('visibilitychange', release);
    // 只有键盘 Tab 聚焦才暂停；鼠标点击链接留下的焦点不算，并且点完立即释放
    scroller.addEventListener('focusin', e => { kbFocus = e.target.matches(':focus-visible'); });
    scroller.addEventListener('focusout', () => { kbFocus = false; });
    scroller.addEventListener('click', e => { const a = e.target.closest('a'); if (a) { a.blur(); kbFocus = false; } });
    const touched = () => { touchUntil = Date.now() + 4000; };
    scroller.addEventListener('touchstart', touched, { passive: true });
    scroller.addEventListener('touchmove', touched, { passive: true });
    requestAnimationFrame(frame);
    return { sync, rewind };
  })();

  // 列表末尾的状态块。滚动播报时它夹在最后一条和下一轮第一条之间，原件和克隆各有一份
  function endMarker(looping = !$('feedClone').hidden) {
    const n = state.items.length;
    const scope = (state.window === '24h' ? '最近 24 小时' : '最近 7 天') + (state.q.length >= 2 || state.category || state.mode === 'all' ? '、当前筛选下' : '');
    const box = el('div', { class: 'end' });
    if (state.speed > 0 && state.nextCursor) {
      const text = n >= AUTO_LOAD_CAP ? `已加载最新 ${n} 条`
        : state.more === 'error' ? `已加载 ${n} 条，其余稍后自动重试`
        : `已加载 ${n} 条，正在加载其余内容…`;
      box.append(el('div', { class: 'line', text: text + (looping ? ' · 将从头循环' : '') }));
    } else if (state.nextCursor) {
      if (state.more === 'error') box.append(el('span', { class: 'err', text: '加载失败：' + (state.moreError && state.moreError.status ? state.moreError.message : '网络连接异常') + '　' }));
      box.append(el('button', { class: 'btn', 'data-more': '', disabled: state.more === 'loading' ? '' : null,
        text: state.more === 'loading' ? '加载中…' : state.more === 'error' ? '点击重试' : `加载更多（已显示 ${n} 条）` }));
    } else if (state.more === 'error') {
      box.append(el('span', { class: 'err', text: '列表已更新，正在重新加载…' }));
    } else {
      box.append(el('div', { class: 'line', text: `已经到底了 · ${scope}共 ${n} 条` + (looping ? ' · 将从头循环' : '') }));
    }
    return box;
  }
  // 资讯卡片序列，外加 Tibo 日历卡片：总是排在第一位；滚动播报且有未到期的预告时每隔 25 条再插一张，
  // 否则一轮要滚很久才露一次面。搜索 / 按分类筛选时不插，免得干扰结果
  const TIBO_EVERY = 25;
  function feedNodes() {
    const cards = state.items.map(card);
    if (!state.resets || !state.resets.length || state.q.length >= 2 || state.category) return cards;
    const repeat = state.speed > 0 && upcomingReset();
    const out = [];
    cards.forEach((c, i) => { if (i === 0 || (repeat && i % TIBO_EVERY === 0)) out.push(tiboCard()); out.push(c); });
    return out;
  }

  const bjToday = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai' }).format(new Date());
  // 帖子时间统一按北京时间显示（和日历、预计时间的口径一致），不跟随访客所在时区
  const bjTime = iso => { const t = Date.parse(iso); return isNaN(t) ? '' : new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(t); };
  const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
  const dayLabel = d => `${+d.slice(5, 7)}月${+d.slice(8, 10)}日`;
  const weekdayOf = d => '周' + WEEKDAYS[new Date(d + 'T00:00:00Z').getUTCDay()];
  function upcomingReset() {
    const now = Date.now();
    return (state.resets || [])
      .filter(e => e.status === 'announced' && e.schedule && Date.parse(e.schedule.through || e.schedule.from) >= now)
      .sort((a, b) => Date.parse(a.schedule.from) - Date.parse(b.schedule.from))[0] || null;
  }
  function untilText(iso) {
    const ms = Date.parse(iso) - Date.now();
    if (isNaN(ms)) return '';
    if (ms <= 0) return '预计时间窗口已开始';
    const h = Math.floor(ms / 3600000), d = Math.floor(h / 24);
    return d ? `还有 ${d} 天 ${h % 24} 小时` : h ? `还有 ${h} 小时 ${Math.floor(ms / 60000) % 60} 分钟` : `还有 ${Math.max(1, Math.floor(ms / 60000))} 分钟`;
  }
  // 默认焦点：有未到期预告就看它，否则看最近一次记录
  function tiboFocus() {
    const up = upcomingReset();
    if (up) return up.day;
    const today = bjToday();
    const past = state.resets.map(e => e.day).filter(d => d <= today).sort();
    return past.length ? past[past.length - 1] : state.resets[0].day;
  }

  function tiboCard() {
    const events = state.resets, up = upcomingReset(), focus = tiboFocus(), today = bjToday();
    const sel = state.tibo.sel || focus, month = state.tibo.month || sel.slice(0, 7);
    const byDay = new Map();
    for (const e of events) byDay.set(e.day, (byDay.get(e.day) || []).concat(e));

    // ----- 左：选中日期的事件 -----
    const dayEvents = byDay.get(sel) || [];
    const isUp = up && up.day === sel;
    const info = el('div', { class: 'tibo-info' },
      el('div', { class: 'tibo-eyebrow', text: isUp ? `下一次${up.type === 'reset_credit' ? ' Codex 重置卡发放' : ' Codex 额度全员重置'} · 预告` : sel > today ? '预告' : sel === focus ? '最近一次记录' : '历史记录' }),
      el('div', { class: 'tibo-date' }, dayLabel(sel), el('small', { text: weekdayOf(sel) + (sel === today ? ' · 今天' : '') })),
      isUp ? el('span', { class: 'tibo-count', 'data-until': up.schedule.from, text: untilText(up.schedule.from) }) : null,
    );
    if (!dayEvents.length) info.append(el('p', { class: 'tibo-eyebrow', style: 'margin-top:12px', text: '这一天没有重置或发卡记录。' }));
    for (const e of dayEvents) {
      const post = (e.posts || []).slice().sort((a, b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt))[0];   // 最新的一条帖子
      info.append(el('div', { class: 'tibo-ev' },
        el('span', { class: 'st kind', text: e.label }),
        el('span', { class: 'st ' + (e.status === 'confirmed' ? 'confirmed' : 'announced'), text: e.status === 'confirmed' ? '已确认' : '预告' }),
        el('h4', { text: e.title }),
        e.schedule && e.schedule.label ? el('div', { class: 'when', text: e.schedule.label }) : null,
        e.scope ? el('div', { class: 'scope', text: '适用：' + e.scope }) : null,
        post ? el('div', { class: 'tibo-post' },
          el('q', { text: post.text || post.originalText || '', title: post.originalText || null }),
          el('small', null,
            el('span', { text: ['Tibo', bjTime(post.publishedAt), post.stage].filter(Boolean).join(' · ') }),
            post.url ? link(post.url, '在 X 查看原帖 ↗') : null,
          ),
        ) : null,
      ));
    }

    // ----- 右：月历（固定 6 行，切月份时卡片高度不变） -----
    const [y, m] = month.split('-').map(Number);
    const lead = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;          // 周一开头
    const daysIn = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const grid = el('div', { class: 'cal-grid' }, ...['一', '二', '三', '四', '五', '六', '日'].map(w => el('div', { class: 'wd', text: w })));
    const sum = { direct_reset: 0, reset_credit: 0, announced: 0 };
    for (let i = 0; i < 42; i++) {
      const n = i - lead + 1;
      if (n < 1 || n > daysIn) { grid.append(el('div', { class: 'day blank' })); continue; }
      const d = `${month}-${String(n).padStart(2, '0')}`, evs = byDay.get(d);
      const cls = 'day' + (d === today ? ' today' : '') + (d === sel ? ' sel' : '');
      if (!evs) { grid.append(el('div', { class: cls }, el('b', { text: n }))); continue; }
      const announced = evs.some(e => e.status !== 'confirmed');
      for (const e of evs) { if (e.status === 'confirmed') sum[e.type] = (sum[e.type] || 0) + 1; else sum.announced++; }
      const tag = (evs[0].type === 'reset_credit' ? '发卡' : '重置') + (evs.length > 1 ? '+' : '');
      grid.append(el('button', { type: 'button', class: cls + (announced ? ' announced' : ' confirmed'), 'data-day': d, title: evs.map(e => e.title).join('；') },
        el('b', { text: n }), el('i', { text: tag })));
    }
    const months = events.map(e => e.day.slice(0, 7)).concat(today.slice(0, 7)).sort();
    const shift = k => { const t = new Date(Date.UTC(y, m - 1 + k, 1)); return t.toISOString().slice(0, 7); };
    const parts = [sum.direct_reset && `${sum.direct_reset} 次全员重置`, sum.reset_credit && `${sum.reset_credit} 次发卡`, sum.announced && `${sum.announced} 条预告`].filter(Boolean);
    const cal = el('div', { class: 'cal' },
      el('div', { class: 'cal-head' },
        el('span', { text: `${y} 年 ${m} 月` }),
        el('button', { type: 'button', 'data-month': shift(-1), disabled: month <= months[0] ? '' : null, 'aria-label': '上个月', text: '‹' }),
        el('button', { type: 'button', 'data-month': shift(1), disabled: month >= months[months.length - 1] ? '' : null, 'aria-label': '下个月', text: '›' }),
      ),
      el('div', { class: 'cal-sum', text: parts.length ? '本月：' + parts.join(' · ') : '本月暂无记录' }),
      grid,
      el('div', { class: 'cal-legend' },
        el('span', null, el('i', { style: 'background:var(--cat-tip)' }), '预告'),
        el('span', null, el('i', { style: 'background:var(--ok)' }), '已确认'),
        el('span', { text: '点日期看详情' }),
      ),
    );

    const moved = sel !== focus || month !== focus.slice(0, 7);
    return el('article', { class: 'card tibo' },
      el('div', { class: 'tibo-head' },
        el('strong', { text: 'Codex 重置卡 · 额度重置日历' }),
        el('span', { class: 'sub', text: 'OpenAI Codex 团队的 Tibo 在 X 上的预告与确认' }),
        el('span', { class: 'sp' }, moved ? el('button', { type: 'button', 'data-tibo-reset': '', text: '回到最近' }) : null)),
      el('div', { class: 'tibo-grid' }, info, cal),
    );
  }
  // 点日期 / 翻月份：改状态后把页面上所有日历卡片（含循环用的克隆）原地换新，高度基本不变，不会打乱滚动位置
  function onTiboClick(e) {
    const day = e.target.closest('[data-day]'), mon = e.target.closest('[data-month]'), reset = e.target.closest('[data-tibo-reset]');
    if (!day && !mon && !reset) return false;
    if (day) state.tibo = { sel: day.dataset.day, month: day.dataset.day.slice(0, 7) };
    else if (mon) { if (mon.disabled) return true; state.tibo = { sel: state.tibo.sel || tiboFocus(), month: mon.dataset.month }; }
    else state.tibo = { month: null, sel: null };
    document.querySelectorAll('#scroller .tibo').forEach(n => n.replaceWith(tiboCard()));
    return true;
  }

  function renderEnd() {
    document.querySelectorAll('#scroller .end').forEach(n => n.replaceWith(endMarker()));
  }

  function card(it) {
    const links = it.links || {};
    const meta = el('div', { class: 'meta' },
      it.category ? el('span', { class: 'chip', 'data-cat': it.category, text: CATEGORIES[it.category] || it.category }) : null,
      it.selected && state.mode === 'all' ? el('span', { class: 'chip star', text: '精选' }) : null,
      state.hotRank.has(it.id) ? el('span', { class: 'chip onhot', text: '热点榜第 ' + state.hotRank.get(it.id), title: '这条资讯所属事件正在当前热点榜上' }) : null,
      el('span', { text: (it.source && it.source.name) || '' }),
      el('time', { datetime: it.publishedAt, title: fullTime(it.publishedAt), 'data-ago': it.publishedAt, text: ago(it.publishedAt) }),
      typeof it.score === 'number' ? el('span', { text: 'AI 评分 ' + it.score, title: 'AI 评分，满分 100' }) : null,
    );
    return el('article', { class: 'card' + (state.fresh.has(it.id) ? ' fresh' : ''), 'data-id': it.id },
      meta,
      el('h2', null, el('a', { href: '#read', 'data-open-item': it.id, text: it.title || it.originalTitle || '(无标题)' })),
      it.summary ? el('p', { text: it.summary }) : null,
      it.reason ? el('p', { class: 'reason', text: it.reason }) : null,
      el('div', { class: 'links' },
        links.original ? link(links.original, '原文 ↗') : null,
      ),
    );
  }

  // 接口只给名次、不给热度值和趋势，所以名次变化由本地对比上一版榜单得出
  const NEW_WINDOW = 6 * 3600 * 1000;
  const storyId = t => { const m = /\/story\/([^/?#]+)/.exec((t.links && t.links.story) || ''); return m ? m[1] : null; };
  function hotKey(t) {
    const m = /\/story\/([^/?#]+)/.exec((t.links && t.links.story) || '');
    return m ? m[1] : t.id;               // 事件 id 比代表条目 id 稳定
  }
  function hotMovement(items) {
    const keys = items.map(hotKey), now = Date.now();
    let saved = store.get('hot', null);   // { cur: 当前榜单, prev: 上一版榜单, seen: 各事件首次上榜时间 }
    if (!saved || !Array.isArray(saved.cur)) saved = { cur: keys, prev: null, seen: Object.fromEntries(keys.map(k => [k, 0])) };
    else if (saved.cur.join() !== keys.join()) saved = { cur: keys, prev: saved.cur, seen: saved.seen || {} };
    const seen = {};
    for (const k of keys) seen[k] = k in saved.seen ? saved.seen[k] : now;
    saved.seen = seen;
    store.set('hot', saved);
    return (key, rank) => {
      if (seen[key] && now - seen[key] < NEW_WINDOW) return { cls: 'new', text: '新上榜', title: '6 小时内新上榜' };
      const was = saved.prev ? saved.prev.indexOf(key) + 1 : 0;
      if (!was || was === rank) return null;
      return was > rank ? { cls: 'up', text: `↑ 升 ${was - rank} 位`, title: `上一版第 ${was} 名` } : { cls: 'down', text: `↓ 降 ${rank - was} 位`, title: `上一版第 ${was} 名` };
    };
  }

  function renderHot(items) {
    $('hotAt').textContent = '更新于 ' + clock(Date.now());
    if (!items.length) { $('hot').replaceChildren(el('li', null, el('span'), el('span', { text: '暂无热点' }))); return; }

  function enhanceSelect(sel, alignRight) {

    const menu = el('ul', { class: 'dd-menu' + (alignRight ? ' right' : ''), role: 'listbox', hidden: '' });
    for (const o of sel.options) menu.append(el('li', { role: 'option', tabindex: '-1', 'data-v': o.value, text: o.textContent }));
    wrap.append(sel, btn, menu);

    const items = () => [...menu.children];
    const sync = () => {
      label.textContent = sel.selectedOptions[0] ? sel.selectedOptions[0].textContent : '';
      if (sel.getAttribute('aria-label')) btn.setAttribute('aria-label', sel.getAttribute('aria-label') + '：' + label.textContent);
      items().forEach(li => li.setAttribute('aria-selected', String(li.dataset.v === sel.value)));
    };
    const open = show => {
      if (show) document.querySelectorAll('.dd-menu:not([hidden])').forEach(m => { if (m !== menu) m.previousElementSibling.click(); });
      menu.hidden = !show; btn.setAttribute('aria-expanded', String(show));

    };

      sync(); open(false); btn.focus();
    };
    btn.addEventListener('click', () => open(menu.hidden));
    menu.addEventListener('click', e => { const li = e.target.closest('li'); if (li) choose(li); });
    wrap.addEventListener('keydown', e => {
      const list = items(), i = list.indexOf(document.activeElement);

        el('h2', { text: '安装到' + (isMobile ? '手机' : '电脑') }),
        native ? el('div', { class: 'rd-act', style: 'margin-top:12px' }, native) : null,
        native ? el('p', { class: 'install-note', text: isIOS ? '需要先安装苹果的 TestFlight 应用，打开链接后点「安装」即可。' : (inWeChat ? '微信里点下载可能没反应：请点右上角 ··· → 在浏览器打开，再下载。' : '下载后打开安装；首次安装系统会询问是否允许安装此来源的应用，选允许即可。') }) : null,
        el('p', { class: 'install-note', style: native ? 'margin-top:18px;font-weight:600;color:var(--text)' : '', text: native ? '不想装安装包？也可以把网页添加到桌面，效果相近：' : '安装后有独立图标、全屏打开，不占存储空间，内容自动保持最新。' }),
        el('ol', { class: 'steps' }, ...items),
        isMobile && !isIOS ? el('p', { class: 'install-note', text: '部分国产手机自带浏览器菜单里叫「添加到桌面」，效果相同。' }) : null,
      ];
    }
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); prompt = e; btn.hidden = false; });
    addEventListener('appinstalled', () => { prompt = null; btn.hidden = true; });
    btn.addEventListener('click', async () => {
      if (prompt) {
        prompt.prompt();
        const { outcome } = await prompt.userChoice;
        if (outcome === 'accepted') btn.hidden = true;
        prompt = null;
        return;
      }
      reader.show('安装应用', guideNodes());
    });
    // 没有安装 API 的环境（iOS、微信、其他浏览器）也显示按钮，点开是步骤说明
    if (!standalone) btn.hidden = false;
    return { guideNodes };
  })();

  // 抽屉打开时写入一条历史记录，这样手机上的返回键 / 右滑手势会关闭抽屉，而不是退出页面（app 里就是退出 app）
  const setFilters = (open, viaHistory) => {
    if (open === document.body.classList.contains('filters-open')) return;
    document.body.classList.toggle('filters-open', open);
    if (open) history.pushState({ filters: 1 }, '');
    else if (!viaHistory && history.state && history.state.filters) history.back();
  };
  addEventListener('popstate', () => setFilters(false, true));
  $('tabbar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.view) { setFilters(false); setView(b.dataset.view); } else setFilters(true);
  });
  $('overlay').addEventListener('click', () => setFilters(false));
  $('closeFilters').addEventListener('click', () => setFilters(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (state.readerOpen) reader.close(); else setFilters(false); } });
  setView(store.get('view', 'feed') === 'hot' ? 'hot' : 'feed');

  let qTimer;
  $('q').addEventListener('input', e => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      const v = e.target.value.trim();
      const before = state.q.length >= 2 ? state.q : '';
      state.q = v;
      if ((v.length >= 2 ? v : '') !== before) resetQuery();
    }, 500);
  });

  $('refresh').addEventListener('click', refresh);
  $('scroller').addEventListener('click', e => { if (onTiboClick(e)) return; if (e.target.closest('[data-more]')) loadMore(); });
  document.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'r' && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) refresh();
  });

  $('theme').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    store.set('theme', root.dataset.theme);
  });
  const savedTheme = store.get('theme', null);
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;

  // 用截止时间而不是 setInterval(refresh)：后台标签页定时器被节流、电脑休眠唤醒后都能立刻补上
  setInterval(() => {
    if (state.nextAt && Date.now() >= state.nextAt && !state.loading) refresh();
    else renderStatus();
  }, 1000);
  setInterval(() => {
    document.querySelectorAll('[data-ago]').forEach(n => { n.textContent = ago(n.dataset.ago); });
    document.querySelectorAll('[data-until]').forEach(n => { n.textContent = untilText(n.dataset.until); });
    expireFresh();
  }, 30000);

  refresh();

  // 安装为手机应用（PWA）需要 Service Worker；本地文件直接打开时不注册
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
